name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly full scan of main: pull requests fail only on vulnerabilities they
  # introduce, so this is where an advisory against a merged dependency surfaces.
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: build / lint / test
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build (release)
        run: cargo build --release --locked

  # The organization's shared scan: Socket, OSV (diff mode on pull requests,
  # absolute otherwise) and cargo-deny against deny.toml.
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@4a56829e5f1be54347d6708b0a86972e56d594ac # v1.3.0
    with:
      cargo-deny: true
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
